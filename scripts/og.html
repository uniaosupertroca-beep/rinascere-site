<!doctype html>
<!-- Arte da prévia de link (WhatsApp, Instagram, Google): 1200x630. Gerada por scripts/gerar-imagens.mjs. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:"Raleway";src:url("../node_modules/@fontsource-variable/raleway/files/raleway-latin-wght-normal.woff2") format("woff2");font-weight:100 900}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px}
body{font-family:Raleway,sans-serif;background:#1c1a18;color:#efe8dd;position:relative;overflow:hidden;font-variant-numeric:lining-nums}
.luz{position:absolute;inset:-20%;background:radial-gradient(40% 50% at 80% 25%,rgba(184,149,106,.32),transparent 70%),radial-gradient(40% 50% at 10% 95%,rgba(184,149,106,.16),transparent 70%)}
.conteudo{position:absolute;left:80px;top:72px;right:80px}
.marca{display:inline-grid;justify-items:end;line-height:1}
.marca b{font-size:40px;font-weight:300}
.marca small{font-size:14px;font-weight:600;letter-spacing:.42em;margin-right:-.42em;color:#b8956a;margin-top:6px}
h1{margin-top:54px;font-size:64px;line-height:1.04;font-weight:200;letter-spacing:-.02em}
h1 strong{font-weight:650;color:#b8956a}
p{margin-top:24px;font-size:25px;color:#c9c0b3}
.palavra{position:absolute;left:0;right:0;bottom:-92px;text-align:center;font-size:240px;font-weight:200;letter-spacing:-.02em;color:transparent;-webkit-text-stroke:1px rgba(184,149,106,.45)}
</style>
</head>
<body>
<div class="luz"></div>
<div class="palavra">Rinascere</div>
<div class="conteudo">
  <span class="marca"><b>Rinascere</b><small>aesthetics</small></span>
  <h1>Harmonização íntima masculina<br><strong>com discrição.</strong></h1>
  <p>Itajaí (SC) · Avaliação individual pelo WhatsApp</p>
</div>
</body>
</html>
